<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200" fill="none">
  <!-- Chain -->
  <line x1="50" y1="0" x2="50" y2="80" stroke="#D4AF37" stroke-width="3" stroke-dasharray="8 4" />
  
  <!-- Hanging Loop -->
  <circle cx="50" cy="86" r="8" stroke="#D4AF37" stroke-width="3" />
  
  <!-- Bell Body Group (with pivot point for sway animation) -->
  <g id="bell-body">
    <!-- Top Cap of the Bell -->
    <path d="M35 100 C35 90, 65 90, 65 100 L70 115 L30 115 Z" fill="#D4AF37" stroke="#A4801B" stroke-width="1" />
    
    <!-- Main Flare of the Bell -->
    <path d="M30 115 C30 135 20 160 15 170 C40 175 60 175 85 170 C80 160 70 135 70 115 Z" fill="#D4AF37" stroke="#A4801B" stroke-width="1" />
    
    <!-- Bell Bottom Rim -->
    <ellipse cx="50" cy="170" rx="35" ry="8" fill="#E5BE3F" stroke="#A4801B" stroke-width="2" />
    
    <!-- Inner bell mouth / lip shading -->
    <ellipse cx="50" cy="170" rx="31" ry="5" fill="#A4801B" />
    
    <!-- Clapper (Ghanti Lolak) -->
    <circle cx="50" cy="182" r="7" fill="#D4AF37" stroke="#A4801B" stroke-width="1" />
    <line x1="50" y1="170" x2="50" y2="175" stroke="#A4801B" stroke-width="4" />
    
    <!-- Engravings on Bell (radial line markings) -->
    <path d="M32 130 Q50 135 68 130" stroke="#A4801B" stroke-width="1.5" />
    <path d="M26 148 Q50 155 74 148" stroke="#A4801B" stroke-width="1.5" />
  </g>
</svg>
